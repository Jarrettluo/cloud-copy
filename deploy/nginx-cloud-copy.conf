# cloud-copy · nginx 片段（追加到你站点的 server 块内，按需调整 root 路径）
# 2026-10-23 首次部署

    # ===== 云复制 CloudCopy（取件码文件柜）=====
    location = /cloud-copy { return 301 /cloud-copy/; }

    location /cloud-copy/api/ {
        proxy_pass http://127.0.0.1:7012/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 210m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /cloud-copy/ {
        root /var/www;
        try_files $uri $uri/ /cloud-copy/index.html;
    }